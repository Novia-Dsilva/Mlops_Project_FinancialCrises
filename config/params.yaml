# params.yaml - MLOps Pipeline Configuration (Data + Training Focus)

# params.yaml - Complete MLOps Configuration
# Location: config/params.yaml

# ============================================================================
# DATA COLLECTION
# ============================================================================
data_collection:
  start_date: '2005-01-01'
  end_date: 'today'
  
  fred_series:
    - GDPC1           # GDP
    - CPIAUCSL        # CPI (Inflation)
    - UNRATE          # Unemployment Rate
    - FEDFUNDS        # Federal Funds Rate
    - T10Y3M          # Yield Curve Spread
    - UMCSENT         # Consumer Confidence
    - DCOILWTICO      # Oil Price
    - BOPGSTB         # Trade Balance
    - BAA10Y          # Corporate Bond Spread
    - TEDRATE         # TED Spread
    - DGS10           # Treasury 10Y Yield
    - STLFSI4         # Financial Stress Index
    - BAMLH0A0HYM2    # High Yield Spread
  
  companies:
    - JPM
    - BAC
    - AAPL
    - MSFT
    - GS
    - MS
    - C
    - WFC
    - USB
    - PNC
    - TFC
    - BK
    - AXP
    - COF
    - DFS
    - SYF
    - V
    - MA
    - PYPL
    - BLK
    - SCHW
    - STT
    - NTRS
    - BEN
    - IVZ

# ============================================================================
# DATA PREPARATION
# ============================================================================
data_preparation:
  source_file: 'merged_features_clean_with_anomaly_flags_with_drift_flags.csv'
  source_location: 'data/processed'
  
  # Multi-task regression targets (excluding EPS due to missing data)
  target_columns:
    - Revenue_Growth
    - Debt_to_Equity
    - Stock_Return
  
  exclude_columns:
    - Date
    - Company
    - Company_Name
    - Sector
    - Ticker
    - Quarter
    - Year
    - Financial_Distress
    - EPS
  
  include_sector_as_feature: false
  
  # Temporal splits - CRITICAL for no data leakage
  temporal_splits:
    train_end: '2018-12-31'
    val_end: '2022-12-31'

# ============================================================================
# FEATURE SELECTION & COMPARISON
# ============================================================================
feature_selection:
  enabled: true
  method: 'xgboost_importance'
  top_n: 20
  comparison_mode: true  # Train on BOTH full and top20
  results_file: 'data/processed/feature_selection_results.pkl'

# ============================================================================
# FEATURE SCALING
# ============================================================================
scaling:
  requires_scaling:
    - lstm
    - lstm_gru
    - linear_regression
    - random_forest
  no_scaling:
    - xgboost
  scaler_type: 'standard'
  fit_on: 'train_only'
  save_path: 'models/scalers/'

# ============================================================================
# LSTM MODEL CONFIGURATION
# ============================================================================
lstm:
  full_features:
    architecture:
      hidden_units: [128, 64]
      dropout_rate: 0.3
      activation: 'relu'
    training:
      epochs: 50
      batch_size: 32
      learning_rate: 0.001
      optimizer: 'adam'
      early_stopping_patience: 10
      reduce_lr_patience: 5
      reduce_lr_factor: 0.5
    regularization:
      l2_reg: 0.01
  
  top20_features:
    architecture:
      hidden_units: [64, 32]
      dropout_rate: 0.3
      activation: 'relu'
    training:
      epochs: 50
      batch_size: 32
      learning_rate: 0.001
      optimizer: 'adam'
      early_stopping_patience: 10
      reduce_lr_patience: 5
      reduce_lr_factor: 0.5

# ============================================================================
# LSTM + GRU HYBRID CONFIGURATION
# ============================================================================
lstm_gru:
  full_features:
    architecture:
      lstm_units: 64
      gru_units: 32
      dropout_rate: 0.3
      recurrent_dropout: 0.2
    training:
      epochs: 50
      batch_size: 32
      learning_rate: 0.001
      optimizer: 'adam'
      early_stopping_patience: 10
  
  top20_features:
    architecture:
      lstm_units: 32
      gru_units: 16
      dropout_rate: 0.3
      recurrent_dropout: 0.2
    training:
      epochs: 50
      batch_size: 32
      learning_rate: 0.001
      optimizer: 'adam'
      early_stopping_patience: 10

# ============================================================================
# XGBOOST CONFIGURATION
# ============================================================================
xgboost:
  multi_task_strategy: 'separate_models_per_target'
  
  full_features:
    model:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.01
      min_child_weight: 1
      subsample: 0.8
      colsample_bytree: 0.8
      early_stopping_rounds: 10
      random_state: 42
  
  top20_features:
    model:
      n_estimators: 100
      max_depth: 5
      learning_rate: 0.1
      min_child_weight: 1
      subsample: 0.8
      colsample_bytree: 0.8
      early_stopping_rounds: 10
      random_state: 42

# ============================================================================
# MLFLOW EXPERIMENTS
# ============================================================================
mlflow:
  tracking_uri: 'mlruns'
  registry_name: 'market_volatility_models'
  
  # Common tags for all experiments
  common_tags:
    project: 'Market_Volatility_Risk_Analysis'
    university: 'Northeastern_University'
    course: 'DADS_7305'
    team: 'MLOps_Capstone_Team'
    use_case: 'financial_risk_prediction'
    targets: 'Revenue_Growth, Debt_to_Equity, Stock_Return'
    data_period: '2005-2025'
  
  # Experiment definitions
  experiments:
    lstm_full:
      name: '01_LSTM_FullFeatures'
      description: 'LSTM multi-task model on all engineered features'
      tags:
        model_type: 'lstm'
        feature_set: 'full'
        uses_scaling: true
        multi_task: true
    
    lstm_top20:
      name: '02_LSTM_Top20Features'
      description: 'LSTM multi-task model on top 20 XGBoost-selected features'
      tags:
        model_type: 'lstm'
        feature_set: 'top20'
        uses_scaling: true
        multi_task: true
    
    lstm_gru_full:
      name: '03_LSTM_GRU_FullFeatures'
      description: 'LSTM+GRU hybrid on all features'
      tags:
        model_type: 'lstm_gru'
        feature_set: 'full'
        uses_scaling: true
        multi_task: true
    
    lstm_gru_top20:
      name: '04_LSTM_GRU_Top20Features'
      description: 'LSTM+GRU hybrid on top 20 features'
      tags:
        model_type: 'lstm_gru'
        feature_set: 'top20'
        uses_scaling: true
        multi_task: true
    
    xgboost_full:
      name: '05_XGBoost_FullFeatures'
      description: 'XGBoost (3 separate models) on all features'
      tags:
        model_type: 'xgboost'
        feature_set: 'full'
        uses_scaling: false
        multi_task: false
        strategy: 'separate_per_target'
    
    xgboost_top20:
      name: '06_XGBoost_Top20Features'
      description: 'XGBoost (3 separate models) on top 20 features'
      tags:
        model_type: 'xgboost'
        feature_set: 'top20'
        uses_scaling: false
        multi_task: false
        strategy: 'separate_per_target'
  
  log_params: true
  log_metrics: true
  log_artifacts: true
  log_models: true

# ============================================================================
# EVALUATION METRICS
# ============================================================================
evaluate:
  metrics:
    - mae
    - rmse
    - r2
    - mape
  per_target_metrics: true
  min_performance:
    r2: 0.80
    mae_relative: 0.15

# ============================================================================
# PATHS
# ============================================================================
paths:
  raw_data: 'data/raw'
  processed_data: 'data/processed'
  features: 'data/features'
  models: 'models'
  trained_models: 'models/trained'
  scalers: 'models/scalers'
  checkpoints: 'models/checkpoints'
  logs: 'logs'
  mlruns: 'mlruns'
  plots: 'plots'

# ============================================================================
# LOGGING
# ============================================================================
logging:
  level: 'INFO'
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  log_to_file: true
  log_dir: 'logs'
  log_file: 'training.log'
  log_to_console: true

# ============================================================================
# METADATA
# ============================================================================
metadata:
  project_name: 'Market Volatility Risk Analysis Platform'
  version: '1.0.0'
  created_date: '2025-01-12'
  team: 'MLOps Capstone Team - Northeastern University'
  course: 'DADS 7305 - Machine Learning Operations'
  contact: 'finance.stress.analyser@gmail.com'

  # Gmail App Password (DO NOT commit to git - use environment variable instead)
